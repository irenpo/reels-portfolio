<!doctype html>
<html lang="ru">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#f5f3ef" />

          document.body.innerHTML = `

                <a href="./dist/index.html" style="display:inline-flex;align-items:center;min-height:52px;padding:0 24px;border-radius:100px;background:#151515;color:#fff;text-decoration:none;font-weight:600">Открыть готовый сайт →</a>

        })

    </script>
    <script type="module" src="/src/main.ts"></script>
